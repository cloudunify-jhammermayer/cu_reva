User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
StartServers 2
LogFile "/dev/stdout"
LogLevel Info
PidFile "/tmp/tinyproxy.pid"

# The proxy is only reachable on the internal Docker network, so allow clients
# there. (Egress is constrained by the filter below, not by client ACLs.)
Allow 0.0.0.0/0

# Default-deny: only destination hosts matching a line in the filter file are
# reachable. Everything else (i.e. an exfiltration attempt to an attacker host)
# is refused.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On

# HTTPS (CONNECT) is only permitted to 443 — no tunnelling to arbitrary ports.
ConnectPort 443
