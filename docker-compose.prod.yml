# Production compose — Nginx + Let's Encrypt TLS, Docker secrets for PEM.
# Prereqs:
#   1. Copy .env.example to .env and fill in values.
#   2. Place GitHub App private key at ./secrets/github-app-private-key.pem
#   3. Run scripts/setup-letsencrypt.sh once to obtain the initial cert.
#   4. docker compose -f docker-compose.prod.yml up -d

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      REVA_DOMAIN: ${REVA_DOMAIN}
      # Tell the nginx entrypoint to only expand $REVA_DOMAIN in templates,
      # leaving nginx variables like $host and $remote_addr untouched.
      NGINX_ENVSUBST_FILTER: REVA_DOMAIN
    # INFR-1: nginx caches the TLS cert at startup and the cert volume is :ro, so
    # after certbot renews it keeps serving the OLD cert until restarted — ~60
    # days on it serves an EXPIRED cert and GitHub silently stops delivering
    # webhooks. certbot runs in a separate container and can't signal us, so
    # reload every 6h to pick up renewed certs. The stock entrypoint still runs
    # template substitution first, then execs this command.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"]
    volumes:
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h; done'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - reva-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      # Secrets injected as files (tmpfs), not env — see secrets: below.
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      REVA_API_KEY_FILE: /run/secrets/reva_api_key
      # Production fails closed: the API refuses to start without REVA_API_KEY.
      REVA_REQUIRE_API_KEY: "true"
    secrets:
      - github_private_key
      - github_webhook_secret
      - reva_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Operational alerts (queue depth, failed jobs, repo-cache disk).
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Liveness via the heartbeat file the loop touches each tick (see main.py).
      test: ["CMD-SHELL", "find /tmp/reva-scheduler-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint chowns the /repos volume as root, then drops to the
    # unprivileged 'worker' user via gosu. These are the only capabilities
    # that sequence needs; the review CLI itself runs without them.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      REVA_REPO_CACHE_DIR: /repos
      REVA_DEFAULT_MODEL: ${REVA_DEFAULT_MODEL:-claude-sonnet-4-6}
      REVA_DEEP_MODEL: ${REVA_DEEP_MODEL:-claude-opus-4-7}
      REVA_CODEGRAPH_ENABLED: ${REVA_CODEGRAPH_ENABLED:-false}
      REVA_CODEGRAPH_INDEX_TIMEOUT: ${REVA_CODEGRAPH_INDEX_TIMEOUT:-180}
      # Optional rolling 24-hour spend cap (USD); unset = no cap.
      REVA_DAILY_BUDGET_USD: ${REVA_DAILY_BUDGET_USD:-}
    volumes:
      - repo_cache:/repos
    secrets:
      - github_private_key
      - anthropic_api_key
    # On deploy/stop, give RQ's warm shutdown time to finish an in-flight review
    # before Docker SIGKILLs it. Matches the review job timeout (1800s) plus a
    # small margin. A review still in flight past this is SIGKILLed and then
    # swept by the scheduler's stale-running reaper (REVA_STALE_RUNNING_SECONDS).
    stop_grace_period: 1830s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d reviews"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 320M
    networks:
      - reva-net
    restart: unless-stopped

volumes:
  postgres_data:
  letsencrypt_data:
  certbot_www:
  repo_cache:

networks:
  reva-net:
    driver: bridge

secrets:
  github_private_key:
    file: ./secrets/github-app-private-key.pem
  github_webhook_secret:
    file: ./secrets/github_webhook_secret
  reva_api_key:
    file: ./secrets/reva_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
