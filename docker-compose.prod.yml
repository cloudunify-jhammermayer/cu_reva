# Production compose — nginx reverse proxy behind a Cloudflare tunnel.
# TLS is terminated at the Cloudflare edge; cloudflared (run on the host) forwards
# reva.dev.cloudunify.org to nginx on 127.0.0.1:8080. No certs are needed here.
# Prereqs:
#   1. Copy .env.example to .env and fill in values (REVA_DOMAIN=reva.dev.cloudunify.org).
#   2. Place GitHub App private key at ./secrets/github-app-private-key.pem
#      (and secrets/reva_secret_key for the Odoo-instances Fernet key)
#   3. Point your cloudflared ingress at http://localhost:8080
#   4. docker compose -f docker-compose.prod.yml up -d

services:
  nginx:
    build:
      # Root context so the image can also build the docs SPA from docs-ui/.
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      # Loopback only — the Cloudflare tunnel (cloudflared on the host) is the
      # sole ingress; nothing is exposed publicly. Point cloudflared at this.
      # Published on host port 80 to match the tunnel's current origin
      # (originService=http://localhost:80). Bind BOTH IPv4 and IPv6 loopback:
      # on this host `localhost` resolves to ::1, so without the ::1 bind
      # cloudflared can't reach nginx and returns 502.
      # NOTE: deviates from the docs' documented :8080 origin — revisit if the
      # tunnel's Public Hostname is later pointed at localhost:8080.
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    environment:
      REVA_DOMAIN: ${REVA_DOMAIN}
      # Tell the nginx entrypoint to only expand $REVA_DOMAIN in templates,
      # leaving nginx variables like $host and $remote_addr untouched.
      NGINX_ENVSUBST_FILTER: REVA_DOMAIN
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      # Secrets injected as files (tmpfs), not env — see secrets: below.
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      REVA_API_KEY_FILE: /run/secrets/reva_api_key
      # Fernet key: the API encrypts Odoo instances' outbound callback keys at rest.
      REVA_SECRET_KEY_FILE: /run/secrets/reva_secret_key
      # Production fails closed: the API refuses to start without REVA_API_KEY.
      REVA_REQUIRE_API_KEY: "true"
      # Auto-audit repos when an installation is created / repos are added.
      # Set false to register them without kicking off an audit.
      REVA_AUTO_AUDIT_REPOS: ${REVA_AUTO_AUDIT_REPOS:-true}
    secrets:
      - github_private_key
      - github_webhook_secret
      - reva_api_key
      - reva_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Operational alerts (queue depth, failed jobs, repo-cache disk).
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Liveness via the heartbeat file the loop touches each tick (see main.py).
      test: ["CMD-SHELL", "find /tmp/reva-scheduler-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint chowns the /repos volume as root, then drops to the
    # unprivileged 'worker' user via gosu. These are the only capabilities
    # that sequence needs; the review CLI itself runs without them.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      # Fernet key for decrypting per-instance Odoo callback keys at rest.
      # Provided as a tmpfs secret (see secrets: below).
      REVA_SECRET_KEY_FILE: /run/secrets/reva_secret_key
      REVA_REPO_CACHE_DIR: /repos
      REVA_DEFAULT_MODEL: ${REVA_DEFAULT_MODEL:-claude-sonnet-5}
      REVA_DEEP_MODEL: ${REVA_DEEP_MODEL:-claude-opus-4-8}
      REVA_VERIFY_MODEL: ${REVA_VERIFY_MODEL:-claude-haiku-4-5}
      REVA_TRIAGE_ENABLED: ${REVA_TRIAGE_ENABLED:-false}
      # Monthly value report: Chat delivery opt-in (reports persist regardless).
      REVA_VALUE_REPORT_CHAT_ENABLED: ${REVA_VALUE_REPORT_CHAT_ENABLED:-false}
      REVA_CODEGRAPH_ENABLED: ${REVA_CODEGRAPH_ENABLED:-false}
      REVA_CODEGRAPH_INDEX_TIMEOUT: ${REVA_CODEGRAPH_INDEX_TIMEOUT:-180}
      REVA_CORE_KNOWLEDGE_ENABLED: ${REVA_CORE_KNOWLEDGE_ENABLED:-false}
      REVA_CORE_VERSIONS: ${REVA_CORE_VERSIONS:-}
      REVA_CORE_KNOWLEDGE_DIR: /core
      # Optional rolling 24-hour spend cap (USD); unset = no cap.
      REVA_DAILY_BUDGET_USD: ${REVA_DAILY_BUDGET_USD:-}
    volumes:
      - repo_cache:/repos
      - ${REVA_CORE_HOST_DIR:-/srv/reva-core}:/core:ro
    secrets:
      - github_private_key
      - anthropic_api_key
      - reva_secret_key
    # On deploy/stop, give RQ's warm shutdown time to finish an in-flight review
    # before Docker SIGKILLs it. Must exceed REVIEW_JOB_TIMEOUT (= LOCK_WAIT_BUDGET
    # + SUBPROCESS_TIMEOUT + JOB_TIMEOUT_BUFFER = 2100s, reva/claude_code_runner.py);
    # 2160s = timeout + 60s margin. A review still in flight past this is SIGKILLed
    # and then swept by the scheduler's stale-running reaper (REVA_STALE_RUNNING_SECONDS).
    stop_grace_period: 2160s
    healthcheck:
      # Liveness via RQ's TTL-refreshed rq:worker:<hostname>.* Redis key.
      test: ["CMD-SHELL", "python /app/scripts/worker_healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      # Two concurrent jobs: a customer-facing ticket analysis no longer queues
      # behind a 35-min Opus audit. Cross-replica safety is designed in
      # (advisory repo locks, atomic claims, is_already_posted) and was
      # validated 2026-06-14. NOTE: resource limits below are PER REPLICA.
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d reviews"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - reva-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    # Redis is the RQ broker (DB 0 holds the queues + job hashes), so it must
    # NOT evict: allkeys-lru would silently drop enqueued reviews/ticket jobs
    # under memory pressure. noeviction instead fails writes loudly (enqueue
    # errors surface to the webhook/scheduler) once maxmemory is hit — job
    # metadata is tiny, so that headroom is ample. appendonly + a persistent
    # volume means a restart replays the queue instead of losing it (the
    # stale-running reaper only recovers rows that already started).
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 640M
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - reva-net
    restart: unless-stopped

volumes:
  postgres_data:
  repo_cache:
  redis_data:

networks:
  reva-net:
    driver: bridge

secrets:
  github_private_key:
    file: ./secrets/github-app-private-key.pem
  github_webhook_secret:
    file: ./secrets/github_webhook_secret
  reva_api_key:
    file: ./secrets/reva_api_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  reva_secret_key:
    file: ./secrets/reva_secret_key
