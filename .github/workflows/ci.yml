name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install ruff mypy
      - name: ruff (blocking)
        run: ruff check reva worker/worker api/app scheduler/scheduler
      - name: mypy (advisory — not yet gating; see docs/production-readiness-plan.md R9)
        continue-on-error: true
        run: mypy reva worker/worker api/app scheduler/scheduler --ignore-missing-imports

  python:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [worker, api, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov
      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: python -m pytest tests/ -q --cov --cov-report=term-missing

  # Real-Postgres integration tier (D1/TEST-1): exercises the PG-only concurrency
  # guards (FOR UPDATE SKIP LOCKED, pg_advisory_xact_lock, reaper) that SQLite
  # no-ops. Gated on REVA_TEST_POSTGRES_URL — skipped in the unit jobs above.
  integration-postgres:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reviews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d reviews"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Install per service (requirements-dev.txt uses relative `-e ..` / `-r
      # requirements.txt`, so they must run from each service directory).
      - name: Run worker Postgres integration tests
        working-directory: worker
        env:
          REVA_TEST_POSTGRES_URL: postgresql://review:test@localhost:5432/reviews
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest tests/test_pg_integration.py -q
      - name: Run scheduler Postgres integration tests
        working-directory: scheduler
        env:
          REVA_TEST_POSTGRES_URL: postgresql://review:test@localhost:5432/reviews
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/test_pg_integration.py -q

  go:
    name: go (tui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: Build / vet / test
        working-directory: tui
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: golangci-lint (advisory — not yet gating; see docs/production-readiness-plan.md R9)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: tui
          version: latest

  # Free, $0-on-GitHub-Team security scanning (no add-ons, no API keys).
  # See docs/security-scanning-setup.md. BLOCKING (INFR-3): security findings
  # fail the build. (mypy + golangci-lint remain advisory pending a verified
  # clean baseline — see their continue-on-error notes above.)
  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks — secret scan (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --no-banner --redact --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: semgrep — SAST (Python + Go)
        run: |
          pip install semgrep
          semgrep scan --error \
            --config p/python --config p/golang --config p/security-audit \
            reva worker api scheduler tui
