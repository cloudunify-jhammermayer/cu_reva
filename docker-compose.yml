# Local development compose — no TLS, direct port exposure.
# Copy .env.example to .env and fill in values before running.
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build worker   # rebuild + restart just the worker
#   docker compose logs -f api         # tail api logs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      REVA_DEBOUNCE_SECONDS: ${REVA_DEBOUNCE_SECONDS:-600}
    volumes:
      - ./secrets/github-app-private-key.pem:/run/secrets/github_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped
    logging: *default-logging

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint chowns /repos as root then drops to 'worker' via gosu.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      ODOO_CALLBACK_URL: ${ODOO_CALLBACK_URL:-}
      ODOO_CALLBACK_API_KEY: ${ODOO_CALLBACK_API_KEY:-}
      REVA_REPO_CACHE_DIR: /repos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets/github-app-private-key.pem:/run/secrets/github_private_key:ro
      - repo_cache:/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable from the dev host, not the LAN.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reva-net
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    ports:
      # Loopback-only: reachable from the dev host, not the LAN.
      - "127.0.0.1:6379:6379"
    networks:
      - reva-net
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  repo_cache:

networks:
  reva-net:
    driver: bridge
