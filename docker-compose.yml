# Local development compose — no TLS, direct port exposure.
# Copy .env.example to .env and fill in values before running.
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build worker   # rebuild + restart just the worker
#   docker compose logs -f api         # tail api logs

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
      REVA_DEBOUNCE_SECONDS: ${REVA_DEBOUNCE_SECONDS:-600}
    volumes:
      - ./secrets/github-app-private-key.pem:/run/secrets/github_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://review:${POSTGRES_PASSWORD}@postgres:5432/reviews
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_private_key
    volumes:
      - ./secrets/github-app-private-key.pem:/run/secrets/github_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - reva-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reva-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - reva-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  reva-net:
    driver: bridge
