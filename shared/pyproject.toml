[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reva-shared"
version = "0.1.0"
description = "Shared library for REVA — types, DB, clients, formatters, diff utils"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reva*"]
