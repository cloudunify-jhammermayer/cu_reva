<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — drifted off</title>
<style>
  :root {
    --ink: #0b2a4a;
    --muted: #5b7a99;
    --cloud: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #cfeefe 0%, #eaf6ff 45%, #f7fbff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { text-align: center; padding: 2rem; }

  .sky { position: relative; height: 200px; margin-bottom: 1.5rem; }

  /* Drifting decorative clouds behind the main one */
  .drift {
    position: absolute;
    top: 30px;
    opacity: 0.55;
    animation: drift 28s linear infinite;
  }
  .drift.two { top: 110px; opacity: 0.35; animation-duration: 40s; animation-delay: -12s; }

  .cloud-main {
    position: relative;
    display: inline-block;
    animation: bob 6s ease-in-out infinite;
    filter: drop-shadow(0 18px 24px rgba(11, 42, 74, 0.18));
  }

  .code {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -42%);
    font-size: 4.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--ink);
  }

  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: .5rem; }
  p  { color: var(--muted); font-size: 1.02rem; line-height: 1.5; }
  .brand {
    margin-top: 2.25rem;
    font-size: .8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: .8;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes drift {
    from { transform: translateX(-220px); }
    to   { transform: translateX(110vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud-main, .drift { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sky">
      <!-- background drifting clouds -->
      <svg class="drift" width="140" height="60" viewBox="0 0 140 60" fill="#ffffff" aria-hidden="true">
        <ellipse cx="45" cy="40" rx="40" ry="20"/><ellipse cx="80" cy="32" rx="32" ry="24"/><ellipse cx="110" cy="42" rx="28" ry="16"/>
      </svg>
      <svg class="drift two" width="180" height="70" viewBox="0 0 180 70" fill="#ffffff" aria-hidden="true">
        <ellipse cx="55" cy="48" rx="50" ry="22"/><ellipse cx="100" cy="38" rx="40" ry="28"/><ellipse cx="140" cy="50" rx="34" ry="18"/>
      </svg>

      <!-- main cloud with the 404 -->
      <div class="cloud-main">
        <svg width="320" height="190" viewBox="0 0 320 190" aria-hidden="true">
          <g fill="var(--cloud)">
            <ellipse cx="100" cy="130" rx="80" ry="48"/>
            <ellipse cx="170" cy="95"  rx="70" ry="58"/>
            <ellipse cx="230" cy="135" rx="70" ry="44"/>
            <rect x="60" y="120" width="210" height="50" rx="25"/>
          </g>
        </svg>
        <div class="code">404</div>
      </div>
    </div>

    <h1>This page drifted off into the clouds.</h1>
    <p>There's nothing to see here — REVA only serves its API and webhooks.</p>

    <div class="brand">REVA · Cloudunify</div>
  </div>
</body>
</html>
