worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SECU-27: don't advertise the nginx version in responses / error pages.
    server_tokens off;

    # Behind the Cloudflare tunnel: cloudflared (on the host) forwards requests
    # to the loopback-published port, so the connection's source is the Docker
    # gateway, not the real client. Restore the true visitor IP from Cloudflare's
    # CF-Connecting-IP header so logs, rate limits, and the GitHub webhook
    # allowlist all see the real source. Only cloudflared can reach this port,
    # so trusting the private ranges it connects from is safe.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;
    # GitHub webhook payloads can be large (large diffs in push events), and
    # create-issues requests carry a base64 consultant docx. Match the API's
    # own 26 MB cap (api/app/main.py) so nginx isn't the silent lower bound.
    client_max_body_size 26m;

    include /etc/nginx/conf.d/*.conf;
}
