[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reva-shared"
version = "0.2.0"
description = "Shared library for REVA — types, DB, clients, formatters, diff utils"
requires-python = ">=3.14"
# Pinned for reproducible images (DEPE-2): same git SHA → same dependency tree.
# Bumps come through Dependabot (pip ecosystems in .github/dependabot.yml).
dependencies = [
    "httpx==0.28.1",
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.12",
    "PyJWT==2.12.1",
    "cryptography==48.0.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "structlog==25.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reva*"]
